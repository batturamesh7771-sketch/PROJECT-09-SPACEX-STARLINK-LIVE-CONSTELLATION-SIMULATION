version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "4000:4000"
      - "4001:4001"

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
