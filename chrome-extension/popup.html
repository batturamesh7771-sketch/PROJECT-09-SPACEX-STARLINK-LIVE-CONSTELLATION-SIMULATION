<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starlink Live Radar &amp; Dish Handoff — Popup</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #04070d;
      --card: rgba(9, 14, 24, 0.92);
      --border: rgba(56, 189, 248, 0.25);
      --cyan: #00f0ff;
      --green: #22c55e;
      --amber: #f59e0b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --mono: 'JetBrains Mono', 'Consolas', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px;
      min-height: 560px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 10px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-family: var(--mono);
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .radar-wrap {
      position: relative;
      width: 100%;
      height: 230px;
      background: radial-gradient(circle at center, #071426 0%, #030710 100%);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    #radarCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .radar-overlay-top {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 10px;
      color: #cbd5e1;
      pointer-events: none;
    }
    .best-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-family: var(--mono);
    }
    .best-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      margin-bottom: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    th {
      text-align: right;
      color: #94a3b8;
      font-weight: 600;
      padding: 2px 4px;
    }
    th:first-child, td:first-child { text-align: left; }
    td {
      text-align: right;
      padding: 2.5px 4px;
      color: #cbd5e1;
    }
    tr.active-lock td {
      color: var(--cyan);
      font-weight: 700;
      background: rgba(0, 240, 255, 0.08);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    button, a.btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(14, 165, 233, 0.18);
      color: #e0f2fe;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    button:hover, a.btn-link:hover {
      background: rgba(14, 165, 233, 0.32);
    }
    .btn-full {
      grid-column: span 2;
      background: linear-gradient(90deg, rgba(0,240,255,0.22), rgba(34,197,94,0.22));
      border-color: rgba(0, 240, 255, 0.55);
      color: #fff;
      font-size: 12px;
    }
    .mtls-bar {
      margin-top: 7px;
      font-family: var(--mono);
      font-size: 10px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛰️ STARLINK LIVE DISH RADAR</div>
    <span id="connBadge" class="badge">LOCKED 1 Hz</span>
  </div>

  <div class="radar-wrap">
    <canvas id="radarCanvas" width="400" height="230"></canvas>
    <div class="radar-overlay-top">
      <span id="gsCoordLabel">GS: 📡 Home (13.08°N, 80.27°E)</span>
      <span id="utcClockLabel">--:--:-- UTC</span>
    </div>
  </div>

  <div class="best-card">
    <div class="best-head">
      <span id="bestTitle">Best: 8+</span>
      <span id="handoffSec">:59</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Starlink</th>
          <th>📡</th>
          <th>📐</th>
          <th>📶</th>
        </tr>
      </thead>
      <tbody id="bestRows"></tbody>
    </table>
  </div>

  <div class="actions">
    <a class="btn-link btn-full" href="../cosmos-webgl-simulator.html" target="_blank">
      🌍 Open Full-Screen 3D Starlink WebGL Simulator
    </a>
    <button id="btnGps">📍 Use My GPS</button>
    <button id="btnOpenSidePanel">📐 Side Panel Telemetry</button>
  </div>

  <div class="mtls-bar">
    <span>mTLS: /CN=funspacecorp (secp384r1)</span>
    <span>11,127 Sats Active</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
